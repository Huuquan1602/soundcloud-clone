<!-- SoundCloud Widget: temporarily visible for debugging -->
<iframe
  #soundcloudIframe
  title="SoundCloud audio player"
  width="100%"
  height="166"
  scrolling="no"
  frameborder="0"
  allow="autoplay; encrypted-media"
  src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2298830912&visual=false"
></iframe>

@if (playerStore.hasTrack()) {
  <lib-player-controls
    [track]="playerStore.currentTrack()"
    [isPlaying]="playerStore.isPlaying()"
    (togglePlay)="onTogglePlay()"
  />
}
