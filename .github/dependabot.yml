version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Angular and Nx must be upgraded together with `nx migrate`.
    ignore:
      - dependency-name: '@angular/*'
      - dependency-name: '@angular-devkit/*'
      - dependency-name: '@schematics/angular'
      - dependency-name: 'angular-eslint'
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: 'typescript'
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
