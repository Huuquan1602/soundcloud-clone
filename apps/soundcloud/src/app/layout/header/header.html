<header class="header">
  <div class="header__inner">
    <a class="header__logo" routerLink="/" aria-label="SoundCloud Home">
      <span class="header__logo-icon">☁</span>
      <span class="header__logo-text">SOUNDCLOUD</span>
    </a>

    <nav class="header__nav" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="header__link"
      >
        Home
      </a>

      <a
        routerLink="/feed"
        routerLinkActive="header__link--active"
        class="header__link"
      >
        Feed
      </a>

      <a
        routerLink="/library"
        routerLinkActive="header__link--active"
        class="header__link"
      >
        Library
      </a>
    </nav>

    <div class="header__search">
      <input
        type="search"
        placeholder="Search for artists, bands, tracks..."
        aria-label="Search music"
      />
    </div>

    <div class="header__actions">
      <button class="header__sign-in" type="button">Sign in</button>
      <button class="header__create-account" type="button">
        Create account
      </button>
    </div>
  </div>
</header>
